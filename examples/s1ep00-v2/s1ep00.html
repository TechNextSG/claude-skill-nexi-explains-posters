/* NEXI EXPLAINS EPISODE PROMO - S1 EP00 "Meet Nexi" (the pilot). ?f=34 image, ?f=reel reel.
   Film idea: the episode as an ISSUE #00 COMIC-BOOK COVER. Night city under a huge moon; the Spreadsheet Monster (the pilot's
   own painter, copied by extract_monster.py) rises over the rooftops and roars at Lotus Mart (sample); caped Nexi hovers
   in front of it, fist up, four power orbs orbiting her = the four TechNext services (Odoo ERP, AI, Marketing, Technology).
   Light plan: moon backlight (rim on the monster), searchlight beams from the street, warm windows and a lamp pool on the shop.
   Devices: moon bloom + cloud wisps, volumetric searchlights, haze between skyline layers, comic focus lines, halftone print,
   grain + vignette. Words: series badge top-left (recurring per episode), title + cover line + premiere tape at the bottom. */
.p0{background:#0B1A45}
.p0 canvas{position:absolute;left:0;top:0;width:1080px;height:100%}
.p0 .brand .odoo{height:42px}

/* the series badge (same on every episode promo) */

.p0 .epb .card{border:5px solid #0B1534;border-radius:24px;overflow:hidden;box-shadow:8px 9px 0 #0B1534;background:#2A5BD0}
.p0 .epb .band{display:flex;align-items:center;gap:10px;padding:11px 18px 10px;background:#0B1534;color:#fff;font:800 19px/1 var(--display);letter-spacing:.07em}
.p0 .epb .band i{width:12px;height:12px;border-radius:50%;background:#5FD3FF;box-shadow:0 0 10px #5FD3FF}
.p0 .epb .num{display:flex;align-items:flex-end;gap:12px;padding:4px 18px 10px;background:linear-gradient(180deg,#4D86EE,#2A5BD0)}
.p0 .epb .num small{font:800 40px/1 var(--display);color:#fff;padding-bottom:16px;-webkit-text-stroke:7px #0B1534;paint-order:stroke fill}
.p0 .epb .num b{font:800 100px/.9 var(--display);letter-spacing:-.04em;background:none;color:#FFD84A;-webkit-text-stroke:10px #0B1534;paint-order:stroke fill;text-shadow:0 7px 0 #0B1534}
.p0 .epb .tag{display:inline-block;margin:14px 0 0 4px;padding:9px 18px 8px;border:4px solid #0B1534;border-radius:999px;background:#FFD84A;color:#0B1534;font:800 20px/1 var(--display);letter-spacing:.06em;box-shadow:5px 5px 0 #0B1534;transform:rotate(-3deg)}

/* bottom stack: title, cover line, premiere tape */
.p0 .words{top:auto;bottom:158px}
.p0 .ttl{position:relative;width:fit-content;margin:0;font:800 142px/.9 var(--display);letter-spacing:-.02em;white-space:nowrap}
.p0 .ttl span{display:block}
.p0 .ttl .bk{color:#0B1534;-webkit-text-stroke:18px #0B1534;text-shadow:0 11px 0 #0B1534}
.p0 .ttl .fr{position:absolute;left:0;top:0;color:#fff}
.p0 .ttl .fr em{font-style:normal;background:linear-gradient(180deg,#FFF59A 8%,#FFD84A 48%,#FFA51A 92%);-webkit-background-clip:text;background-clip:text;color:transparent}
.p0 .cov{margin-top:22px;font:600 31px/1.3 var(--text);color:rgba(255,255,255,.9);letter-spacing:-.005em}
.p0 .cov b{color:#fff;font-weight:800}
.p0 .prem{display:inline-flex;align-items:center;gap:14px;margin-top:20px;padding:12px 26px 12px 12px;background:#FFD84A;border:4px solid #0B1534;border-radius:16px;box-shadow:7px 7px 0 #0B1534;transform:rotate(-1.4deg);transform-origin:left center;
  font:800 27px/1 var(--display);color:#0B1534;letter-spacing:.01em;white-space:nowrap}
.p0 .prem .pl{width:44px;height:44px;border-radius:12px;background:#0B1534;display:grid;place-items:center}
.p0 .prem .pl svg{width:20px;height:20px;margin-left:3px}
.p0 .prem s{text-decoration:none;opacity:.45;margin:0 -2px}

/* the four powers = the four TechNext services (colours match the orbs) */
.p0 .pows{display:flex;align-items:center;gap:12px;margin-top:16px;white-space:nowrap}
.p0 .pows .k{font:800 19px/1 var(--display);letter-spacing:.1em;color:rgba(255,255,255,.7);margin-right:2px}
.p0 .pows .pc{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 16px 0 6px;border-radius:999px;background:var(--c);border:3px solid #0B1534;box-shadow:3px 4px 0 #0B1534;
  font:800 21px/1 var(--display);color:#fff;letter-spacing:-.005em}
.p0 .pows .pc svg{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);padding:4px;color:#fff}

.p0 .foot .btn svg{width:30px;height:30px}

/* reel: the bottom stack sits above the footer (430) */
.p0.f-reel .words{bottom:530px;right:140px}
.p0.f-reel .epb{top:300px}

<script>
(function () {
  var W = TN.W, H = TN.H, LOOP = 8, TAU = Math.PI * 2, M = window.EP00M, INK = '#0B1534';
  var DY = TN.pick({ 34: 0, reel: 108 });   // reel: the title must sit on the street line, as in 3:4
  var S = {}, rr = M.rrP, ell = M.ellP, poly = M.polyP, hsh = M.hsh;
  var NEXI = { x: 100, y: 408, h: 522, nx: 0.39, ny: 0.505 };   // the hero render (nexi-cam 'hero' hold): neck at (nx, ny) of the image
  var ORB = { cx: 0, cy: 0, rx: 226, ry: 104, tilt: -0.13, ph: 0.82 };
  var POW = [['ODOO ERP', '#9A62BC', '#5E3A74', 'layers'], ['AI', '#4A86F0', '#1F4CAE', 'bot'], ['MARKETING', '#FF6A94', '#C92F5D', 'mega'], ['TECHNOLOGY', '#26BE88', '#127552', 'chip']];
  var GROUND = 1000;

  function img(src) { return new Promise(function (res) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = function () { res(null); }; i.src = src; }); }

  function setup(post) {
    var dpr = window.devicePixelRatio || 1; S.dpr = dpr; S.post = post;
    var c = post.querySelector('canvas'); c.width = W * dpr; c.height = H * dpr; S.g = c.getContext('2d');
    S.mc = document.createElement('canvas'); S.rc = document.createElement('canvas'); S.mc.width = S.rc.width = W * dpr; S.mc.height = S.rc.height = H * dpr;
    /* seeded scenery */
    var R = TN.rand(20261013); S.stars = [];
    for (var i = 0; i < 150; i++) S.stars.push([R() * W, R() * 760 - 120, 0.7 + R() * 2.1, R() * TAU, 1 + Math.floor(R() * 3)]);
    S.far = []; for (var x = -40; x < W + 40;) { var w = 60 + R() * 70; S.far.push([x, w, 150 + R() * 210]); x += w + 2; }
    S.mid = []; for (var x2 = -60; x2 < W + 60;) { var w2 = 90 + R() * 80; S.mid.push([x2, w2, 120 + R() * 190, R()]); x2 += w2 + 8; }
    return Promise.all([img('assets/nexi/nexi-ep00-hero.png'), img('assets/logo/logo-plane.png'), document.fonts.load('64px Bangers')]).then(function (a) { S.nexi = a[0]; S.plane = a[1]; });
  }

  /* ---------- painters ---------- */
  function windows(g, x, top, w, h, col, seed, step) {
    var p = new Path2D(), st = step || 28;
    for (var wy = top + 18; wy < top + h - 20; wy += st) for (var wx = x + 12; wx < x + w - 18; wx += 22) if (hsh(wx * 0.37 + wy * 1.3 + seed) > 0.56) p.rect(wx, wy, 9, 13);
    g.fillStyle = col; g.fill(p);
  }
  function cloud(g, x, y, s) { var p = new Path2D(); [[0, 0, 70], [70, -26, 86], [150, 0, 64], [80, 24, 70]].forEach(function (c) { p.moveTo(x + c[0] * s + c[2] * s, y + c[1] * s); p.arc(x + c[0] * s, y + c[1] * s, c[2] * s, 0, TAU); }); return p; }

  function sky(g, th) {
    var gr = g.createLinearGradient(0, -DY, 0, GROUND); gr.addColorStop(0, '#081646'); gr.addColorStop(0.36, '#1B3290'); gr.addColorStop(0.62, '#4A47A8'); gr.addColorStop(0.82, '#B0679E'); gr.addColorStop(1, '#F39C7E');
    g.fillStyle = gr; g.fillRect(0, -DY, W, GROUND + DY + 40);
    /* stars (twinkle on integer harmonics) */
    var sp = new Path2D(); S.stars.forEach(function (s) { var a = 0.45 + 0.55 * Math.sin(th * s[4] + s[3]); if (a < 0.15) return; sp.moveTo(s[0] + s[2], s[1]); sp.arc(s[0], s[1], s[2] * (0.6 + 0.4 * a), 0, TAU); });
    g.fillStyle = 'rgba(255,255,255,.8)'; g.fill(sp);
  }
  function halftone(g, x0, y0, w, h, col, step, dir) {
    var p = new Path2D(), st = step || 20;
    for (var yy = y0, r = 0; yy < y0 + h; yy += st, r++) for (var xx = x0 + (r % 2 ? st / 2 : 0); xx < x0 + w; xx += st) {
      var d = dir === 'l' ? 1 - (xx - x0) / w : (xx - x0) / w, v = d * (dir === 'b' ? (yy - y0) / h : 1), rad = 0.4 + v * 4.6; if (rad < 0.6) continue; p.moveTo(xx + rad, yy); p.arc(xx, yy, rad, 0, TAU); }
    g.fillStyle = col; g.fill(p);
  }
  function moon(g, th, mx, my, r) {
    var gl = g.createRadialGradient(mx, my, r * 0.6, mx, my, r * 3.1); gl.addColorStop(0, 'rgba(255,240,205,.55)'); gl.addColorStop(0.35, 'rgba(255,226,180,.16)'); gl.addColorStop(1, 'rgba(255,226,180,0)');
    g.fillStyle = gl; g.fillRect(mx - r * 3.2, my - r * 3.2, r * 6.4, r * 6.4);
    var mg = g.createRadialGradient(mx - r * 0.3, my - r * 0.35, r * 0.1, mx, my, r); mg.addColorStop(0, '#FFFBEA'); mg.addColorStop(0.75, '#FFF1CC'); mg.addColorStop(1, '#F2DDAA');
    g.fillStyle = mg; g.fill(ell(mx, my, r, r));
    g.fillStyle = 'rgba(206,186,140,.45)'; [[-0.32, -0.2, 0.2], [0.28, 0.32, 0.15], [0.4, -0.36, 0.1], [-0.1, 0.45, 0.09], [-0.52, 0.22, 0.07]].forEach(function (c) { g.fill(ell(mx + c[0] * r, my + c[1] * r, c[2] * r, c[2] * r * 0.86)); });
    g.lineWidth = 6; g.strokeStyle = 'rgba(11,21,52,.55)'; g.stroke(ell(mx, my, r, r));
  }
  function beam(g, x, y, ang, len, w0, w1, a) {
    var ex = x + Math.sin(ang) * len, ey = y - Math.cos(ang) * len, nx = Math.cos(ang), ny = Math.sin(ang);
    var gr = g.createLinearGradient(x, y, ex, ey); gr.addColorStop(0, 'rgba(255,248,214,' + a + ')'); gr.addColorStop(0.55, 'rgba(255,248,214,' + a * 0.45 + ')'); gr.addColorStop(1, 'rgba(255,248,214,0)');
    g.save(); g.globalCompositeOperation = 'lighter'; g.filter = 'blur(6px)'; g.fillStyle = gr;
    g.fill(poly([[x - nx * w0, y - ny * w0], [x + nx * w0, y + ny * w0], [ex + nx * w1, ey + ny * w1], [ex - nx * w1, ey - ny * w1]]));
    g.filter = 'none'; g.restore();
    return [ex, ey];
  }
  function signal(g, cx, cy, th) {
    g.save(); g.fillStyle = 'rgba(122,132,205,.42)'; g.fill(cloud(g, cx - 175, cy + 14, 1.05)); g.restore();
    g.save(); g.shadowColor = 'rgba(255,240,180,.95)'; g.shadowBlur = 50; g.fillStyle = 'rgba(255,248,214,.93)'; g.fill(ell(cx, cy, 96, 66)); g.restore();
    if (S.plane) { var w = 96, h = w * S.plane.naturalHeight / S.plane.naturalWidth; g.save(); g.globalAlpha = 0.95; g.drawImage(S.plane, cx - w / 2, cy - h / 2, w, h); g.restore(); }
  }
  function skyline(g, th) {
    /* far row in haze */
    g.save(); g.filter = 'blur(1.6px)'; g.fillStyle = '#41449A';
    S.far.forEach(function (b) { tower(g, b[0], GROUND - b[2] - 60, b[1], GROUND + 20); g.fill(); });
    S.far.forEach(function (b, i) { winP(g, b[0], GROUND - b[2] - 60, b[1], b[2] + 60, 'rgba(255,214,140,.3)', i * 7, 30); }); g.restore();
    var hz = g.createLinearGradient(0, GROUND - 330, 0, GROUND); hz.addColorStop(0, 'rgba(176,103,158,0)'); hz.addColorStop(1, 'rgba(240,150,130,.5)'); g.fillStyle = hz; g.fillRect(0, GROUND - 330, W, 330);
  }
  function midRow(g, th) {
    S.mid.forEach(function (b, i) {
      var x = b[0], top = GROUND - b[2]; g.fillStyle = '#16255C'; tower(g, x, top, b[1], GROUND + 30); g.fill(); g.fillStyle = '#2C4290'; tower(g, x + b[1] - 8, top, 8, GROUND + 30); g.fill();
      winP(g, x, top, b[1], b[2], 'rgba(255,212,126,.72)', b[0], 28);
      if (b[3] > 0.62) { var ax = px(x + b[1] / 2, top); g.strokeStyle = '#16255C'; g.lineWidth = 4; g.beginPath(); g.moveTo(ax, top); g.lineTo(px(x + b[1] / 2, top - 46), top - 46); g.stroke();
        if (Math.sin(th * 4 + i) > 0) { g.save(); g.shadowColor = '#FF5A6E'; g.shadowBlur = 14; g.fillStyle = '#FF6A7C'; g.fill(ell(px(x + b[1] / 2, top - 48), top - 48, 5, 5)); g.restore(); } }
    });
  }
  /* Lotus Mart (sample): the pilot's shop, redrawn small */
  function shop(g, x, y, s) {
    var C = M.cel, PINK = '#FF4D7A'; g.save(); g.translate(x, y); g.scale(s, s);
    var w = 300, h = 230;
    C(g, rr(0, 0, w, h, 8), '#FFF4E0', '#EBD2AE', 16, 0, 6); C(g, rr(-10, -8, w + 20, 22, 6), '#E9C9A0', '#D2A97A', 0, 6, 5);
    var aw = new Path2D(); aw.moveTo(-14, 14); aw.lineTo(w + 14, 14); aw.lineTo(w + 14, 66); for (var sc = 6; sc >= 0; sc--) aw.arc(-14 + (w + 28) * (sc + 0.5) / 7, 66, (w + 28) / 14, 0, Math.PI, false); aw.closePath();
    g.save(); g.clip(aw); for (var st = 0; st < 7; st++) { g.fillStyle = st % 2 ? '#FFFFFF' : PINK; g.fillRect(-14 + st * (w + 28) / 7, 10, (w + 28) / 7 + 1, 90); } g.restore(); g.lineWidth = 5; g.strokeStyle = INK; g.stroke(aw);
    var wn = rr(22, 100, 132, 108, 8); g.fillStyle = '#9FC3F0'; g.fill(wn); g.save(); g.clip(wn); g.fillStyle = '#C98B52'; g.fillRect(22, 176, 132, 10); [[30, '#FF8A8A'], [62, '#FFD84A'], [96, '#7DD3A8']].forEach(function (b) { g.fillStyle = b[1]; g.fill(rr(b[0], 152, 26, 24, 4)); }); g.fillStyle = 'rgba(255,255,255,.35)'; g.fill(poly([[40, 100], [80, 100], [30, 208], [22, 208], [22, 140]])); g.restore();
    g.lineWidth = 5; g.strokeStyle = INK; g.stroke(wn);
    C(g, rr(180, 100, 98, 130, 8), '#8B5A2B', '#6B4423', 10, 0, 5); g.fillStyle = '#FFD84A'; g.fill(ell(262, 168, 6, 6));
    /* door sign: CLOSED */
    g.fillStyle = '#8A93A6'; g.fill(rr(193, 124, 72, 26, 13)); g.fillStyle = '#fff'; g.font = '800 15px "Plus Jakarta Sans"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('CLOSED', 229, 138);
    /* name board + sample chip */
    g.fillStyle = '#fff'; g.fill(rr(40, -58, w - 80, 50, 14)); g.lineWidth = 4; g.strokeStyle = INK; g.stroke(rr(40, -58, w - 80, 50, 14));
    g.fillStyle = '#1F1F3D'; g.font = '800 27px "Plus Jakarta Sans"'; g.fillText('Lotus Mart', w / 2, -32);
    g.fillStyle = '#EEF2FA'; g.fill(rr(w - 64, -86, 84, 28, 14)); g.fillStyle = '#4C4C63'; g.font = '700 17px Inter'; g.fillText('Sample', w - 22, -71);
    g.restore();
  }
  function nearRow(g, th) {
    var rows = [[-20, 150, 118], [126, 120, 84], [790, 120, 96], [906, 190, 140]];
    rows.forEach(function (b, i) { var x = b[0], w = b[1], top = GROUND - b[2]; g.fillStyle = '#0B1534'; tower(g, x, top, w, GROUND + 60); g.fill(); g.fillStyle = '#1D2E66'; tower(g, x - 5, top - 9, w + 10, top + 2); g.fill(); winP(g, x, top, w, b[2], 'rgba(255,214,130,.78)', i * 31 + 5, 26); });
    /* street + lamp pools */
    g.fillStyle = '#0A1330'; g.fillRect(0, GROUND, W, H - GROUND + 10);
    g.fillStyle = '#1A2856'; g.fillRect(0, GROUND, W, 10);
    [[790, 0.48], [1050, 0.34]].forEach(function (l) { var lx = l[0], lg = g.createRadialGradient(lx, GROUND - 120, 6, lx, GROUND - 40, 230); lg.addColorStop(0, 'rgba(255,220,140,' + l[1] + ')'); lg.addColorStop(1, 'rgba(255,220,140,0)'); g.fillStyle = lg; g.fillRect(lx - 240, GROUND - 330, 480, 400);
      g.fillStyle = '#222E55'; g.fill(rr(lx - 4, GROUND - 150, 8, 152, 4)); g.fill(rr(lx - 22, GROUND - 160, 44, 14, 7)); g.fillStyle = '#FFE6A8'; g.fill(ell(lx, GROUND - 150, 13, 7)); });
  }

  /* ---------- v2: low camera. Verticals converge on a vanishing point high above the frame (we look UP at the city). ---------- */
