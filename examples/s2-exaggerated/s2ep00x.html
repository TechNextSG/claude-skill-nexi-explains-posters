<script>
(function () {
  var W = TN.W, H = TN.H, TAU = Math.PI * 2, INK = NXP.INK, rr = NXP.rr, S = {};
  var TILT = -0.07, PIV = [540, 700], GROUND = 1010, SUN = [846, 214];
  var NEXI = { cx: 500, bot: 770, h: 390, bx: 0.45 };
  var SHIELD = { x: 500, y: 668, r: 318, a0: -2.85, a1: -0.18 };

  var TEAM = [['jun', 92, 250, 'worried', [0.18, 0.55], 'phone'], ['maria', 186, 246, 'worried', [0.32, 0.14], 'clipboard'], ['ben', 420, 262, 'wow', [0.5, 0.45], null], ['lim', 300, 292, 'wow', [2.72, 2.66], null]];
  var ORBS = [[302, 470, 38, '#2F5FC4', '#1D3F8E', 'train'], [742, 612, 42, '#F28C28', '#B85E10', 'adapt'], [588, 846, 38, '#21A366', '#137A4A', 'grow']];
  function img(src) { return new Promise(function (res) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = function () { res(null); }; i.src = src; }); }
  function setup(post) {
    var dpr = window.devicePixelRatio || 1; S.dpr = dpr; S.post = post;
    var c = post.querySelector('canvas'); c.width = W * dpr; c.height = H * dpr; S.g = c.getContext('2d'); NXP.offscreen(S, W, H);
    return Promise.all([img('assets/nexi/nexi-s2-shield.png'), document.fonts.load('60px Bangers')]).then(function (a) { S.nexi = a[0]; });
  }
  /* ---------- painters ---------- */
  function sheet(g, x, y, w, rot, blur, lw) {
    var h = w * 0.76; g.save(); g.translate(x, y); g.rotate(rot); if (blur) g.filter = 'blur(' + blur + 'px)';
    g.fillStyle = '#FFFFFF'; g.fill(rr(-w / 2, -h / 2, w, h, w * 0.06)); g.fillStyle = '#21A366'; g.fillRect(-w / 2 + 1, -h / 2 + 1, w - 2, h * 0.17);
    var cols = ['#FFB3C1', '#FFE36E', '#BFE3FF'];
    for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) if ((r * 3 + c * 5 + Math.round(w)) % 4 === 0) { g.fillStyle = cols[(r + c) % 3]; g.fillRect(-w / 2 + w * 0.06 + c * w * 0.22, -h / 2 + h * 0.27 + r * h * 0.17, w * 0.2, h * 0.14); }
    g.strokeStyle = 'rgba(33,163,102,.45)'; g.lineWidth = Math.max(1, w * 0.012); g.beginPath();
    for (var i = 1; i < 4; i++) { var gx = -w / 2 + w * 0.06 + i * w * 0.22; g.moveTo(gx - 1, -h / 2 + h * 0.25); g.lineTo(gx - 1, h / 2 - h * 0.06); }
    for (var j = 0; j <= 4; j++) { var gy = -h / 2 + h * 0.26 + j * h * 0.17; g.moveTo(-w / 2 + w * 0.05, gy); g.lineTo(w / 2 - w * 0.05, gy); } g.stroke();
    if (!blur && lw) { g.lineWidth = lw; g.strokeStyle = INK; g.stroke(rr(-w / 2, -h / 2, w, h, w * 0.06)); }
    g.restore();
  }
  function wavePath() {
    var p = new Path2D(); p.moveTo(1240, 1080); p.lineTo(1240, 150);
    p.bezierCurveTo(1120, 150, 980, 150, 880, 190); p.bezierCurveTo(760, 238, 660, 300, 636, 380);
    p.bezierCurveTo(626, 414, 640, 440, 668, 428); p.bezierCurveTo(700, 404, 760, 392, 808, 410);
    p.bezierCurveTo(870, 436, 904, 490, 900, 560); p.bezierCurveTo(892, 720, 870, 890, 880, 1080); p.closePath(); return p;
  }
  function wave(g) {
    var p = wavePath(), R = TN.rand(77);
    g.save(); g.clip(p);
    var b = g.createLinearGradient(700, 0, 1100, 1000); b.addColorStop(0, '#E9FFF2'); b.addColorStop(1, '#8FD9B2'); g.fillStyle = b; g.fillRect(600, -80, 700, 1200);
    /* the paper: sheets packed along the wave's flow (curling left near the crest) */
    for (var y = -40; y < 1100; y += 40) for (var x = 640; x < 1260; x += 52) {
      var jx = x + (R() - 0.5) * 30 + ((y / 40) % 2) * 26, jy = y + (R() - 0.5) * 20, t = Math.min(1, Math.max(0, (jy - 60) / 700));
      var rot = -0.9 * (1 - t) + 0.25 * t + (R() - 0.5) * 0.7, w = 62 + R() * 46;
      sheet(g, jx, jy, w, rot, 0, 2.6);
    }
    /* shade: the face and the tube darken, the back-lit crest glows */
    var sh = g.createLinearGradient(660, 0, 1000, 0); sh.addColorStop(0, 'rgba(8,22,70,.42)'); sh.addColorStop(0.35, 'rgba(8,22,70,.12)'); sh.addColorStop(1, 'rgba(8,22,70,0)'); g.fillStyle = sh; g.fillRect(600, 300, 500, 800);
    var lo = g.createLinearGradient(0, 600, 0, 1080); lo.addColorStop(0, 'rgba(8,22,70,0)'); lo.addColorStop(1, 'rgba(8,22,70,.45)'); g.fillStyle = lo; g.fillRect(600, 600, 700, 480);
    g.save(); g.globalCompositeOperation = 'lighter'; var cr = g.createRadialGradient(SUN[0], SUN[1] + 40, 20, SUN[0], SUN[1] + 40, 360); cr.addColorStop(0, 'rgba(255,230,160,.55)'); cr.addColorStop(1, 'rgba(255,230,160,0)'); g.fillStyle = cr; g.fillRect(500, -100, 800, 700); g.restore();
    g.restore();
    /* back-lit rim along the crest, then the ink outline */
    g.save(); g.lineJoin = 'round'; g.lineWidth = 16; g.strokeStyle = 'rgba(255,236,180,.55)'; g.filter = 'blur(4px)'; g.stroke(p); g.restore();
    g.lineJoin = 'round'; g.lineWidth = 8; g.strokeStyle = INK; g.stroke(p);
    /* foam curls along the crest and the lip */
    var line = [[1250, 150], [1160, 150], [1070, 156], [980, 166], [900, 184], [830, 212], [770, 244], [716, 286], [676, 330], [652, 376], [652, 414]], foam = [], FR = TN.rand(31);
    for (var i = 0; i < line.length - 1; i++) for (var k = 0; k < 4; k++) { var u = k / 4, fx = line[i][0] + (line[i + 1][0] - line[i][0]) * u, fy = line[i][1] + (line[i + 1][1] - line[i][1]) * u, r = 30 - (i + u) * 1.8 + FR() * 8;
      foam.push([fx + (FR() - 0.5) * 10, fy + (FR() - 0.6) * 12, Math.max(10, r)]); }
    foam.forEach(function (f) { g.beginPath(); g.arc(f[0], f[1], f[2] + 5, 0, TAU); g.fillStyle = INK; g.fill(); });
    foam.forEach(function (f) { g.beginPath(); g.arc(f[0], f[1], f[2], 0, TAU); g.fillStyle = '#FFFFFF'; g.fill(); });
    foam.forEach(function (f) { g.beginPath(); g.arc(f[0] + f[2] * 0.25, f[1] + f[2] * 0.3, f[2] * 0.55, 0, TAU); g.fillStyle = 'rgba(150,200,235,.35)'; g.fill(); });
    /* sheets pouring off the lip into the hollow */
    [[690, 470, 54, 0.9], [726, 520, 46, 1.3], [700, 560, 38, 0.6]].forEach(function (s2) { sheet(g, s2[0], s2[1], s2[2], s2[3], 0, 2.2); });
  }
  function spray(g) {   /* sheets flung off the lip toward the top-left, with speed lines */
    var R = TN.rand(12);
    g.save(); g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineCap = 'round';
    for (var i = 0; i < 18; i++) { var x = 380 + R() * 400, y = 90 + R() * 260, l = 50 + R() * 90; g.lineWidth = 3 + R() * 3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + l * 0.86, y + l * 0.5); g.stroke(); }
    g.restore();
    [[700, 150, 70, -0.6], [600, 110, 58, -0.2], [470, 360, 60, 0.5], [580, 300, 52, 0.9], [400, 120, 48, -0.8], [760, 70, 44, 0.3], [330, 300, 56, -0.4], [520, 210, 46, 0.7]].forEach(function (s) { sheet(g, s[0], s[1], s[2], s[3], 0, 2.4); });
    [[700, 70, '#FFE36E', 0.3], [450, 250, '#FFB3C1', -0.5], [300, 200, '#BFE3FF', 0.4]].forEach(function (n) { g.save(); g.translate(n[0], n[1]); g.rotate(n[3]); g.fillStyle = n[2]; g.fillRect(-20, -20, 40, 40); g.lineWidth = 2.5; g.strokeStyle = INK; g.strokeRect(-20, -20, 40, 40); g.restore(); });
  }
  function skyline(g) {
    var R = TN.rand(5), p = new Path2D(); for (var x = -120; x < 900;) { var w = 60 + R() * 80, h = 90 + R() * 170; p.rect(x, GROUND - h, w, h + 60); x += w + 6; }
    g.fillStyle = '#284A9E'; g.fill(p);
    var wn = new Path2D(); R = TN.rand(6); for (var i = 0; i < 160; i++) { var wx = -100 + R() * 980, wy = GROUND - 20 - R() * 220; wn.rect(wx, wy, 9, 12); } g.fillStyle = 'rgba(255,214,130,.4)'; g.fill(wn);
    var hz = g.createLinearGradient(0, GROUND - 260, 0, GROUND); hz.addColorStop(0, 'rgba(62,116,222,0)'); hz.addColorStop(1, 'rgba(120,160,240,.35)'); g.fillStyle = hz; g.fillRect(-200, GROUND - 260, 1500, 260);
    /* Bluebay Trading's sign over the team (sample company) */
    g.save(); g.translate(650, 958); g.rotate(-0.02); g.fillStyle = '#FFFFFF'; g.fill(rr(-118, -30, 236, 60, 14)); g.lineWidth = 4; g.strokeStyle = INK; g.stroke(rr(-118, -30, 236, 60, 14));
    g.fillStyle = '#2F5FC4'; g.beginPath(); g.arc(-94, -2, 11, 0, TAU); g.fill(); g.fillStyle = INK; g.font = '800 22px "Plus Jakarta Sans"'; g.textBaseline = 'middle'; g.fillText('Bluebay Trading', -76, -9); g.fillStyle = '#6A6A84'; g.font = '600 13px Inter'; g.fillText('sample company', -76, 13); g.restore();
    var st = g.createLinearGradient(0, GROUND, 0, GROUND + 500); st.addColorStop(0, '#16307A'); st.addColorStop(1, '#0B1D52'); g.fillStyle = st; g.fillRect(-200, GROUND, 1500, 600);
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(-200, GROUND, 1500, 4);
  }
  function shield(g) {
    var s = SHIELD; g.save(); g.globalCompositeOperation = 'lighter';
    var fill = g.createRadialGradient(s.x, s.y, s.r * 0.4, s.x, s.y, s.r); fill.addColorStop(0, 'rgba(95,211,255,0)'); fill.addColorStop(0.85, 'rgba(95,211,255,.16)'); fill.addColorStop(1, 'rgba(160,235,255,.42)');
    g.fillStyle = fill; g.beginPath(); g.moveTo(s.x, s.y); g.arc(s.x, s.y, s.r, s.a0, s.a1); g.closePath(); g.fill();
    /* hex cells on the shield */
    g.strokeStyle = 'rgba(190,240,255,.28)'; g.lineWidth = 2;
    for (var a = s.a0 + 0.08; a < s.a1; a += 0.17) for (var rr2 = s.r * 0.55; rr2 < s.r; rr2 += 44) { var hx = s.x + Math.cos(a) * rr2, hy = s.y + Math.sin(a) * rr2; g.beginPath(); for (var k = 0; k <= 6; k++) { var ha = k / 6 * TAU; g.lineTo(hx + Math.cos(ha) * 16, hy + Math.sin(ha) * 16); } g.stroke(); }
    g.filter = 'blur(10px)'; g.strokeStyle = 'rgba(120,220,255,.9)'; g.lineWidth = 26; g.beginPath(); g.arc(s.x, s.y, s.r, s.a0, s.a1); g.stroke(); g.filter = 'none';
    g.strokeStyle = 'rgba(235,252,255,1)'; g.lineWidth = 7; g.beginPath(); g.arc(s.x, s.y, s.r, s.a0, s.a1); g.stroke();
    g.restore();
  }
  function clash(g) {
    var x = CLASH[0], y = CLASH[1];
    g.save(); g.globalCompositeOperation = 'lighter';
    var gl = g.createRadialGradient(x, y, 4, x, y, 210); gl.addColorStop(0, 'rgba(255,255,240,1)'); gl.addColorStop(0.18, 'rgba(255,236,150,.85)'); gl.addColorStop(0.5, 'rgba(120,210,255,.25)'); gl.addColorStop(1, 'rgba(120,210,255,0)');
    g.fillStyle = gl; g.beginPath(); g.arc(x, y, 210, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,250,220,.95)'; g.lineCap = 'round';
    for (var i = 0; i < 14; i++) { var a = i / 14 * TAU + 0.12, toNexi = Math.atan2(480 - y, 520 - x), da = Math.atan2(Math.sin(a - toNexi), Math.cos(a - toNexi)); if (Math.abs(da) < 0.75) continue; var  r0 = 46 + (i % 3) * 8, r1 = r0 + 60 + (i % 2) * 50; g.lineWidth = 5 - (i % 2) * 2; g.beginPath(); g.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); g.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); g.stroke(); }
    g.restore();
    g.save(); g.translate(x, y); g.rotate(0.3); g.fillStyle = '#FFFFFF'; g.beginPath(); for (var j = 0; j < 16; j++) { var aa = j / 16 * TAU, rr3 = j % 2 ? 18 : 52; g.lineTo(Math.cos(aa) * rr3, Math.sin(aa) * rr3); } g.closePath(); g.fill(); g.restore();
  }
  function orb(g, o) {
    var x = o[0], y = o[1], r = o[2];
    g.save(); g.globalCompositeOperation = 'lighter'; var h = g.createRadialGradient(x, y, r * 0.5, x, y, r * 2.4); h.addColorStop(0, o[3] + 'AA'); h.addColorStop(1, o[3] + '00'); g.fillStyle = h; g.fillRect(x - r * 2.5, y - r * 2.5, r * 5, r * 5); g.restore();
    var s = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r); s.addColorStop(0, '#FFFFFF'); s.addColorStop(0.2, o[3]); s.addColorStop(1, o[4]); g.fillStyle = s; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.save(); g.translate(x, y); g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineWidth = r * 0.12; g.lineCap = 'round';
    if (o[5] === 'train') { g.beginPath(); g.moveTo(-r * 0.5, 0); g.lineTo(r * 0.5, 0); g.stroke(); g.fillRect(-r * 0.56, -r * 0.3, r * 0.2, r * 0.6); g.fillRect(r * 0.36, -r * 0.3, r * 0.2, r * 0.6); }
    else if (o[5] === 'adapt') { g.beginPath(); g.moveTo(-r * 0.55, -r * 0.2); g.bezierCurveTo(-r * 0.2, -r * 0.2, -r * 0.2, r * 0.35, 0, r * 0.35); g.bezierCurveTo(r * 0.25, r * 0.35, r * 0.2, -r * 0.4, r * 0.55, -r * 0.4); g.stroke(); }
